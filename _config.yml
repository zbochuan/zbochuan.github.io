# Hexo Configuration ## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: 百川赴海
subtitle: ''
description: ''
keywords:
author: 博川
language: zh-Hans
timezone: Australia/Sydney

# URL
url: http://bochuan.site
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
syntax_highlighter: highlight.js

# highlight:
#   line_number: true
#   auto_detect: false
#   tab_replace: ''
#   wrap: true
#   hljs: false

marked:
  prependRoot: true
  postAsset: true

prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
  巴别塔(babel-tower): babel-tower
  千机图(computer-architecture): computer-architecture
  码术苑(software-design-architecture): software-design-architecture
  算(hermes): algorithm
tag_map:

tag_generator:
  per_page: 10
  enable_index_page: false  # 这个很重要！

# Search
search:
  path: search.xml
  field: all
  content: true
  format: html
  limit: 10000

# Metadata elements
meta_generator: true

mermaid:
  enable: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:sen
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Archive page
archive_generator:
  per_page: 20
  yearly: true
  monthly: true

# Category page  
category_generator:
  per_page: 10

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
theme: next

# Deployment
deploy:
  type: git
  repo: git@github.com:zbochuan/zbochuan.github.io.git
  branch: main
